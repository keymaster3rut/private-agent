      - name: Verify patch is present
        run: |
          echo "=== Commit yang dibangun ==="
          git log -1 --format='%h %ad %s' --date=iso
          echo "=== Pemeriksaan (gagal bila ada yang hilang) ==="
          grep -q "WakeWordService" lib/screens/home_screen.dart
          grep -q "ExternalTriggerService" lib/screens/home_screen.dart
          grep -q "PluginHostService" lib/screens/home_screen.dart
          grep -q "PluginHostSection" lib/screens/settings_screen.dart
          grep -q "VoiceSettingsSection" lib/screens/settings_screen.dart
          grep -q "PluginHostBridge" android/app/src/main/kotlin/com/orailnoor/privateagent/MainActivity.kt
          grep -q "PluginHostService" android/app/src/main/AndroidManifest.xml
          grep -q "START_VOICE" android/app/src/main/AndroidManifest.xml
          grep -q "FOREGROUND_SERVICE_MICROPHONE" android/app/src/main/AndroidManifest.xml
          grep -q "_clickSmart" lib/services/task_executor.dart
          grep -q "_autoSubmitIfSearchField" lib/services/task_executor.dart
          grep -q "failureCount" lib/services/recovery_engine.dart
          grep -q "open_wake_word" pubspec.yaml
          test -f lib/services/wake_word_service.dart
          test -f lib/services/voice_settings.dart
          test -f lib/widgets/voice_settings_section.dart
          test -f lib/services/plugin_host_service.dart
          test -f lib/widgets/plugin_host_section.dart
          test -f android/app/src/main/kotlin/com/orailnoor/privateagent/PluginHostBridge.kt
          test -f android/app/src/main/kotlin/com/orailnoor/privateagent/PluginHostService.kt
          grep -q "openQuickSettings" lib/services/screen_automation_service.dart
          grep -q "openQuickSettings" android/app/src/main/kotlin/com/orailnoor/privateagent/AgentAccessibilityService.kt
          grep -q "_screenSummary" lib/services/task_executor.dart
          grep -q "open_quick_settings" lib/services/task_executor.dart
          grep -q "_withOcr" lib/services/task_executor.dart
          grep -q "ocrScreen" lib/services/screen_automation_service.dart
          grep -q "ocrScreen" android/app/src/main/kotlin/com/orailnoor/privateagent/AgentAccessibilityService.kt
          grep -q "ocrScreen" android/app/src/main/kotlin/com/orailnoor/privateagent/MainActivity.kt
          grep -q "mlkit" android/app/build.gradle.kts
          grep -q "OcrSettingsSection" lib/screens/settings_screen.dart
          test -f lib/widgets/ocr_settings_section.dart
          ls -l assets/models
          echo "VERIFIKASI OK: semua perubahan ada"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal APK
        run: |
          flutter build apk --release --build-name=1.0.0-hotword7 --build-number=${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-universal-release.apk

      - name: Build architecture-specific APKs
        run: |
          flutter build apk --release --split-per-abi --build-name=1.0.0-hotword7 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: private-agent-android
          path: dist/*
