se if (label.length >= 6 && target.contains(label)) {\n            score = 2;\n          } else if (_commonPrefixLength(label, target) >= 12) {\n            score = 1;\n          }\n          if (score > 0 && node['isClickable'] == true) score += 0.5;\n\n          if (score > bestScore) {\n            bestScore = score;\n            bestX = (left + right) / 2;\n            bestY = (top + bottom) / 2;\n          }\n        }\n      }\n\n      if (bestScore > 0) {\n        return await _screenService.clickAt(bestX, bestY);\n      }\n    } catch (_) {}\n    return false;\n  }\n\n  /// After typing, presses the search/Enter key when the field is a search box\n  /// (recognized by its view id or label), so the search starts right away.\n  Future<bool> _autoSubmitIfSearchField(String? hint) async {\n    try {\n      final searchWords = RegExp(\n        r'search|cari|telusuri|find|query|url_bar|omnibox',\n        caseSensitive: false,\n      );\n      var isSearch = hint != null && searchWords.hasMatch(hint);\n\n      if (!isSearch) {\n        final nodes = await _screenService.dumpScreen();\n        for (final node in nodes) {\n          if (node['isEditable'] != true) continue;\n          final idAndLabel = '${node['viewId'] ?? ''} '\n              '${node['contentDescription'] ?? ''}';\n          if (searchWords.hasMatch(idAndLabel)) {\n            isSearch = true;\n            break;\n          }\n        }\n      }\n      if (!isSearch) return false;\n\n      await Future.delayed(const Duration(milliseconds: 600));\n      final ok = await _submitKeyboardAction();\n      if (ok) await Future.delayed(const Duration(milliseconds: 1500));\n      return ok;\n    } catch (_) {\n      return false;\n    }\n  }\n\n  void _report(String message) {\n"
