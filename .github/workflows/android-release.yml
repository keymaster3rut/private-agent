name: Android release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download hot word models
        run: |
          mkdir -p assets/models
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            if [ -s "assets/models/$f" ]; then
              echo "$f already present, skipping download"
              continue
            fi
            curl -fL --retry 3 -o "assets/models/$f" \
              "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f" \
            || curl -fL --retry 3 -o "assets/models/$f" \
              "https://github.com/dscripka/openWakeWord/raw/v0.5.1/openwakeword/resources/models/$f"
            test "$(stat -c%s "assets/models/$f")" -gt 10000
          done
          ls -l assets/models

