          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import '../services/external_trigger_service.dart';
          import 'voice_settings_section.dart' show SettingsCardBuilder;

          /// Settings card for the external trigger (Tasker hotword plugin etc.).
          class ExternalTriggerSection extends StatefulWidget {
            final SettingsCardBuilder buildCard;
            final bool isDark;

            const ExternalTriggerSection({
              super.key,
              required this.buildCard,
              required this.isDark,
            });

            @override
            State<ExternalTriggerSection> createState() => _ExternalTriggerSectionState();
          }

          class _ExternalTriggerSectionState extends State<ExternalTriggerSection> {
            bool _enabled = false;
            String _mode = ExternalTriggerService.modeAlways;
            bool _loading = true;

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              final prefs = await SharedPreferences.getInstance();
              _enabled = prefs.getBool(ExternalTriggerService.keyEnabled) ?? false;
              _mode =
                  prefs.getString(ExternalTriggerService.keyMode) ??
                  ExternalTriggerService.modeAlways;
              if (mounted) setState(() => _loading = false);
            }

            Future<void> _save() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setBool(ExternalTriggerService.keyEnabled, _enabled);
              await prefs.setString(ExternalTriggerService.keyMode, _mode);
            }

            void _snack(String message) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));
            }

            Future<void> _test() async {
              final reason = await ExternalTriggerService.instance.evaluate();
              if (reason == null) {
                _snack('Trigger accepted: starting voice input.');
                ExternalTriggerService.instance.onTrigger?.call();
              } else {
                _snack(reason);
              }
            }

            @override
            Widget build(BuildContext context) {
              if (_loading) return const SizedBox.shrink();

              return widget.buildCard(
                icon: Icons.extension_outlined,
                title: 'Tasker hotword plugin',
                subtitle: 'Let Tasker (or another automation app) start voice input',
                isDark: widget.isDark,
                children: [
                  SwitchListTile(
                    title: const Text('Enable external trigger'),
                    subtitle: const Text(
                      'When off, trigger intents from other apps are ignored.',
                    ),
                    value: _enabled,
                    contentPadding: EdgeInsets.zero,
                    onChanged: (v) async {
                      setState(() => _enabled = v);
                      await _save();
                    },
                  ),
                  const SizedBox(height: 8),
                  InputDecorator(
                    decoration: InputDecoration(
                      labelText: 'Active when',
                      border: OutlineInputBorder(
                        borderRadius: BorderRadius.circular(12),
                      ),
                      contentPadding: const EdgeInsets.symmetric(
                        horizontal: 12,
                        vertical: 4,
                      ),
                    ),
                    child: DropdownButtonHideUnderline(
                      child: DropdownButton<String>(
                        isExpanded: true,
                        value: _mode,
                        items: const [
                          DropdownMenuItem(
                            value: ExternalTriggerService.modeAlways,
                            child: Text('Always'),
                          ),
                          DropdownMenuItem(
                            value: ExternalTriggerService.modeScreenOn,
                            child: Text('Only when the screen is on'),
                          ),
                          DropdownMenuItem(
                            value: ExternalTriggerService.modeCharging,
                            child: Text('Only while charging'),
                          ),
                        ],
                        onChanged: (v) async {
                          if (v == null) return;
                          setState(() => _mode = v);
                          await _save();
                        },
                      ),
                    ),
                  ),
                  const SizedBox(height: 8),
                  const Text(
                    'This only decides whether a trigger is accepted. The hotword '
                    'plugin itself keeps listening inside Tasker, so to save battery '
                    'also limit the plugin\'s profile in Tasker (for example with a '
                    'Display State = On condition).',
                    style: TextStyle(fontSize: 12),
                  ),
                  const SizedBox(height: 12),
                  const Text(
                    'Tasker setup: Action > System > Send Intent',
                    style: TextStyle(fontWeight: FontWeight.w600),
                  ),
                  const SelectableText(
                    'Action: ${ExternalTriggerService.actionName}\n'
                    'Package: ${ExternalTriggerService.packageName}\n'
                    'Class: ${ExternalTriggerService.className}\n'
                    'Target: Activity',
                    style: TextStyle(fontSize: 12),
                  ),
                  const SizedBox(height: 8),
                  Wrap(
                    spacing: 8,
                    children: [
                      OutlinedButton.icon(
                        onPressed: _test,
                        icon: const Icon(Icons.play_arrow_rounded, size: 18),
                        label: const Text('Test trigger'),
                      ),
                      OutlinedButton.icon(
                        onPressed: () async {
                          await Clipboard.setData(
                            const ClipboardData(text: ExternalTriggerService.actionName),
                          );
                          _snack('Action copied.');
                        },
                        icon: const Icon(Icons.copy_rounded, size: 18),
                        label: const Text('Copy action'),
                      ),
                    ],
                  ),
                ],
              );
            }
          }
          ETSEC_DART
          cat > lib/services/recovery_engine.dart <<'RECOVERY_DART'
          class RecoveryAction {
            final String action;
            final Map<String, dynamic> params;
            final String description;

            RecoveryAction({
              required this.action,
              required this.params,
              required this.description,
            });
          }

          class RecoveryEngine {
            /// Diagnoses the failure and suggests a recovery action based on the last
            /// action and current screen dump.
            ///
            /// [failureCount] is how many times in a row the same action has failed.
            /// Going Back is only used after repeated failures, so a single failed
            /// click no longer throws the agent out of the screen it is working on.
            Future<RecoveryAction> diagnose(
              String lastFailedAction,
              String screenContent, {
              int failureCount = 1,
            }) async {
              final lowerScreen = screenContent.toLowerCase();

              // 1. A real loading indicator is visible -> wait
              if (RegExp(r'\b(progressbar|spinner|loading)\b').hasMatch(lowerScreen)) {
                return RecoveryAction(
                  action: 'wait',
                  params: {},
                  description: 'App seems to be loading, waiting...',
                );
              }

              // 2. Keyboard is likely covering elements -> Press back to dismiss
              //    (only on the first failures, so we do not keep pressing back)
              if (failureCount <= 2 &&
                  (lowerScreen.contains('gboard') || lowerScreen.contains('keyboard'))) {
                return RecoveryAction(
                  action: 'press_back',
                  params: {},
                  description: 'Keyboard might be blocking the screen, dismissing it.',
                );
              }

              // 3. A click failed: look further down/up the same screen instead of
              //    leaving it. The compressed screen dump marks scrollable elements
              //    with a "scroll" tag, the full dump with "scrollable".
              if (lastFailedAction == 'click_text' || lastFailedAction == 'click_at') {
                final scrollable =
                    lowerScreen.contains('scrollable') ||
                    RegExp(r'[\[,]scroll[\],]').hasMatch(lowerScreen);
                if (scrollable && failureCount <= 3) {
                  return RecoveryAction(
                    action: 'scroll',
                    params: {'direction': failureCount >= 3 ? 'up' : 'down'},
                    description: 'Click failed, scrolling to look for the target.',
                  );
                }
                if (failureCount <= 2) {
                  return RecoveryAction(
                    action: 'wait',
                    params: {},
                    description: 'Click failed, waiting and re-reading the screen.',
                  );
                }
                return RecoveryAction(
                  action: 'press_back',
                  params: {},
                  description: 'Click failed repeatedly, pressing back to try another way.',
                );
              }

              // 4. Could not open the app -> go home to try a different approach
              if (lastFailedAction == 'open_app') {
                return RecoveryAction(
                  action: 'press_home',
                  params: {},
                  description: 'Failed to open app, going home to try a different approach.',
                );
              }

              // 5. Generic failure: retry on the same screen first, back only if it persists
              if (failureCount <= 2) {
                return RecoveryAction(
                  action: 'wait',
                  params: {},
                  description: 'Action failed, waiting and retrying on the same screen.',
                );
              }
              return RecoveryAction(
                action: 'press_back',
                params: {},
                description: 'Repeated failure, pressing back to recover.',
              );
            }
          }
          RECOVERY_DART
          echo "Patch selesai"

      - name: Verify patch is present
        run: |
          echo "=== Commit yang dibangun ==="
          git log -1 --format='%h %ad %s' --date=iso
          echo "=== File patch ==="
          ls -l lib/services/wake_word_service.dart lib/services/voice_settings.dart lib/widgets/voice_settings_section.dart
          echo "=== Isi kunci ==="
          grep -n "WakeWordService" lib/screens/home_screen.dart | head -3
          grep -n "VoiceSettingsSection" lib/screens/settings_screen.dart | head -3
          grep -n "open_wake_word\|assets/models" pubspec.yaml
          grep -n "FOREGROUND_SERVICE_MICROPHONE" android/app/src/main/AndroidManifest.xml
          grep -q "WakeWordService" lib/screens/home_screen.dart
          grep -q "VoiceSettingsSection" lib/screens/settings_screen.dart
          grep -q "VoiceSettings" lib/services/voice_service.dart
          grep -q "ExternalTriggerService" lib/screens/home_screen.dart
          grep -q "ExternalTriggerSection" lib/screens/settings_screen.dart
          grep -q "external_trigger" android/app/src/main/kotlin/com/orailnoor/privateagent/MainActivity.kt
          grep -q "START_VOICE" android/app/src/main/AndroidManifest.xml
          test -f lib/services/external_trigger_service.dart
          test -f lib/widgets/external_trigger_section.dart
          grep -q "_clickSmart" lib/services/task_executor.dart
          grep -q "_autoSubmitIfSearchField" lib/services/task_executor.dart
          grep -q "failureCount" lib/services/recovery_engine.dart
          echo "VERIFIKASI OK: semua perubahan ada"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal APK
        run: |
          flutter build apk --release --build-name=1.0.0-hotword4 --build-number=${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-universal-release.apk

      - name: Build architecture-specific APKs
        run: |
          flutter build apk --release --split-per-abi --build-name=1.0.0-hotword4 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: private-agent-android
          path: dist/*
